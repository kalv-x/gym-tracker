    });
  }

  function confirmRemove(e) {
    const w = cur(), s = curSession();
    openModal(`<h2>Remove ${esc(e.name)}?</h2><div class="meta">It'll be taken out of ${esc(sessionName(s, curSi))} this week, and won't be copied into future weeks. Your past history for it stays.</div>
      <div class="actions"><button data-m="cancel">Cancel</button><button class="danger" data-m="rm">Remove</button></div>`, (a) => {
      closeModal();
      if (a !== "rm") return;
      s.exercises.splice(s.exercises.indexOf(e), 1);
      touch(w); render();
    });
  }

  // ---------- gyms ----------
  // Each exercise keeps the weights you last used at each gym in e.byGym; e.sets is what's
  // showing now, for the session's gym (s.gym).
  const GYM_KEY = "gymtracker.gyms.v1";
  let gyms = (() => { try { const g = JSON.parse(localStorage.getItem(GYM_KEY) || "null"); if (Array.isArray(g) && g.length) return g; } catch {} return ["Alexandria", "Waterloo"]; })();
  function saveGyms() { try { localStorage.setItem(GYM_KEY, JSON.stringify(gyms)); } catch {} }
  const PIN = `<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
  function switchGym(w, s, g) {
    if (s.gym === g) return;
    s.exercises.forEach((e) => {
      e.byGym = e.byGym || {};
      if (s.gym) e.byGym[s.gym] = clone(e.sets);   // remember this gym's numbers
      if (e.byGym[g]) e.sets = clone(e.byGym[g]);  // bring back the other gym's; a new gym keeps the current ones
    });
    s.gym = g;
    touch(w);
  }
  function gymSheet(fromSession) {
    openModal(`<h2>Gyms</h2><div class="meta">Each gym remembers its own weights. A new gym starts with the weights you're on now, until you change them.</div>
      <div class="menu">${gyms.map((g) => `<div class="gymrow">${PIN}<span>${esc(g)}</span>${gyms.length > 1 ? `<button data-m="rm:${esc(g)}">Remove</button>` : ""}</div>`).join("")}</div>
      <label>Add a gym</label><input type="text" id="f-gym" placeholder="Gym name" autocomplete="off">
      <div class="actions"><button data-m="close">Close</button><button class="go" data-m="add">Add gym</button></div>`, (a) => {
      if (a === "close") return closeModal();
      if (a.startsWith("rm:")) { gyms = gyms.filter((g) => g !== a.slice(3)); saveGyms(); render(); return gymSheet(fromSession); }
      if (a === "add") {
        const name = $("f-gym").value.trim();
        if (!name) return $("f-gym").focus();
        if (!gyms.some((g) => g.toLowerCase() === name.toLowerCase())) { gyms.push(name); saveGyms(); }
        const g = gyms.find((x) => x.toLowerCase() === name.toLowerCase());
        closeModal(() => { const w = cur(), s = curSession(); if (fromSession && s) switchGym(w, s, g); render(); });
      }
    });
  }

  // ---------- backup ----------
  const APP_VERSION = "3";
  const BUILD = "2026-11-16.10"; // bump on every push so open apps can tell a new version exists
  const EXP_KEY = "gymtracker.lastExport";
  function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function exportBackup() {
    if (saveTimer) writeLocal();
    const data = { app: "gym-tracker", version: 1, exportedAt: new Date().toISOString(), weeks: weeks.map(clone), customLib: clone(customLib), gyms: clone(gyms) };
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `gym-backup-${iso(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    try { localStorage.setItem(EXP_KEY, String(Date.now())); } catch {}
    openModal(`<h2>Backup saved</h2><div class="meta">It's in your Downloads folder as <b>gym-backup-${iso(new Date())}.json</b>. Keep a copy somewhere safe, like Google Drive.</div>
      <div class="actions"><button data-m="close">OK</button></div>`, () => closeModal(() => render()));
  }
  const importInput = document.createElement("input");
  importInput.type = "file"; importInput.accept = ".json,application/json"; importInput.style.display = "none";
  document.body.appendChild(importInput);
  importInput.addEventListener("change", async () => {
    const file = importInput.files[0];
    importInput.value = "";
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); } catch { data = null; }
    const list = data && Array.isArray(data.weeks) ? data.weeks.filter((w) => w && w.id && w.start && Array.isArray(w.sessions)) : [];
    if (!list.length) {
      return openModal(`<h2>Couldn't read that file</h2><div class="meta">Pick a backup made with this app's Export button (a .json file).</div><div class="actions"><button data-m="close">OK</button></div>`, () => closeModal());
    }
    const sheetFormat = list.some((w) => w.sessions.some((s) => "status" in s));
    const ready = list.map((w) => (sheetFormat ? normaliseArchiveWeek(w) : w)).sort((a, b) => a.start.localeCompare(b.start));
    const here = weeks.length;
    openModal(`<h2>Import this backup?</h2>
      <div class="meta">It has <b>${ready.length} weeks</b> (${fmtDate(ready[0].start, true)} to ${fmtDate(ready[ready.length - 1].start, true)}).${here ? ` It will <b>replace</b> the ${here} weeks currently on this phone.` : ""}</div>
      <div class="actions"><button data-m="cancel">Cancel</button><button class="go" data-m="go">Import</button></div>`, (a) => {
      if (a === "cancel") return closeModal();
      overrides = {};
      for (const w of ready) { w.updatedAt = w.updatedAt || Date.now(); overrides[w.id] = w; }
      customLib = Array.isArray(data.customLib) ? data.customLib.filter((x) => x && x.name && x.group) : [];
      if (Array.isArray(data.gyms) && data.gyms.length) { gyms = data.gyms.filter((g) => typeof g === "string" && g.trim()); saveGyms(); }
      try { localStorage.setItem(LIB_KEY, JSON.stringify(customLib)); } catch {}
      try { const t = Date.parse(data.exportedAt); localStorage.setItem(EXP_KEY, String(isNaN(t) ? Date.now() : t)); } catch {}
      writeLocal();
      curId = null; rebuild();
      closeModal(() => go("week", { week: latest() ? latest().id : null }));
    });
  });

  // ---------- updates: tell me when a newer version has been pushed ----------
  let updateShown = false;
  async function checkForUpdate() {
    if (updateShown || !navigator.onLine) return;
    try {
      const t = await (await fetch("./?check=" + Date.now(), { cache: "no-store" })).text();
      const m = t.match(/const BUILD = "([^"]+)"/);
      if (m && m[1] !== BUILD) showUpdateBar();
    } catch {}
  }
  function showUpdateBar() {
    updateShown = true;
    const bar = document.createElement("div");
    bar.className = "snack";
    bar.innerHTML = `<span>New version available</span><button>Reload</button>`;
    bar.querySelector("button").onclick = () => { if (saveTimer) writeLocal(); location.reload(); };
    document.body.appendChild(bar);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
  setTimeout(checkForUpdate, 2500);

  // ---------- navigation (hash-based so the phone's back gesture works) ----------
  let lastBase = null, pendingEdit = false;
  function baseHash() { return location.hash.slice(1).replace(/-m$/, "") || "home"; }
  function hashFor(v, weekId, si) {
    if (v === "past") return "past";
    if (v === "session") return "session-" + weekId + "-" + si;
    return latest() && weekId === latest().id ? "home" : "week-" + weekId;
  }
  function go(v, opts = {}) {
    const wid = "week" in opts ? opts.week : curId;
    const si = "si" in opts ? opts.si : curSi;
    const h = hashFor(v, wid, si);
    if (baseHash() === h && !location.hash.endsWith("-m")) { lastBase = null; route(); return; }
    location.hash = h;
  }
  function route() {
    const h = baseHash();
    let m;
    if (h === "past") view = "past";
    else if ((m = h.match(/^session-(.+)-(\d+)$/))) { view = "session"; curId = m[1]; curSi = +m[2]; }
    else if ((m = h.match(/^week-(.+)$/))) { view = "week"; curId = m[1]; }
    else { view = "week"; curId = latest() ? latest().id : null; }
    if (!weeks.find((w) => w.id === curId)) { curId = latest() ? latest().id : null; if (view === "session") view = "week"; }
    if (h !== lastBase) {
      lastBase = h;
      editMode = pendingEdit; pendingEdit = false;
      render();
      window.scrollTo(0, 0);
      const m = $("main");
      m.classList.remove("enter"); void m.offsetWidth; m.classList.add("enter");
      clearTimeout(route.t); route.t = setTimeout(() => m.classList.remove("enter"), 700);
    }
  }
  window.addEventListener("hashchange", () => {
    if (!location.hash.endsWith("-m")) { closing = false; if ($("modal").innerHTML) $("modal").innerHTML = ""; }
    route();
    if (pendingAfter) { const f = pendingAfter; pendingAfter = null; f(); }
  });

  // ---------- render ----------

  function render() {
    $("tabWeek").classList.toggle("on", view !== "past");
    $("tabPast").classList.toggle("on", view === "past");
    if (view === "past") return renderPast();
    if (view === "session" && curSession()) return renderSession();
    view = "week";
    renderWeek();
  }

  function header(inner) { $("header").innerHTML = inner; showSaved(); }

  function renderWeek() {
    const w = cur();
    if (!w) {
      header(`<div class="h1">Gym</div><div class="h-sub"><span id="saved" class="saved"></span></div>`);
      $("main").innerHTML = `<div class="section" style="margin-top:18px"><h3>Welcome</h3>
        <p style="margin:0 2px 14px">Got a backup file? Import it to bring in all your weeks.</p>
        <button class="primary" data-act="import">Import backup</button>
        <button class="secondary" data-act="newweek" style="margin-top:10px">Start from scratch</button></div>`;
      return;
    }
    const isLatest = w === latest();
    header(`<div class="h1">Week ${esc(w.num ?? "")}</div>
      <div class="h-sub"><span>${weekRange(w)}</span>${w.tag ? `<span class="tag">${esc(w.tag)}</span>` : ""}<span id="saved" class="saved"></span></div>`);
    let h = "";
    if (!isLatest) h += `<div class="banner"><span>You're looking at a past week.</span><button data-act="golatest">Back to this week</button></div>`;
    else if (weeks.length > 1 && !w.sessions.some((x) => x.day || x.missed || x.exercises.some((e) => e.done)))
      h += `<div class="banner"><span>Started this week by mistake?</span><button data-act="delweek">Delete it</button></div>`;
    else h += `<p class="hint">Tap a session to log it.</p>`;
    h += `<div class="slist">`;
    sessDisplay(w).forEach((i) => {
      const s = w.sessions[i], ex = named(s), d = ex.filter((e) => e.done).length;
      let cls = "", stat;
      if (s.missed) { cls = "missed"; stat = "Missed"; }
      else if (s.day) { cls = "done"; stat = `Done ${DAY_FULL[s.day] || s.day} · ${d}/${ex.length} exercises`; }
      else if (d) stat = `In progress · ${d}/${ex.length} exercises`;
      else stat = `Not done yet · ${ex.length} exercises`;
      const pct = ex.length ? Math.round((d / ex.length) * 100) : 0;
      h += `<button class="scard ${cls}" data-act="open" data-si="${i}"><span class="sdot" style="--p:${pct}%"></span><span class="sinfo"><div class="sname">${esc(sessionName(s, i))}</div><div class="sstat">${stat}</div>${s.gym ? `<div class="sgym">${PIN}${esc(s.gym)}</div>` : ""}</span><span class="chev">›</span></button>`;
    });
    h += `</div>`;
    if (isLatest) {
      h += `<div class="section"><h3>Finished this week?</h3><button class="primary" data-act="newweek">Start Week ${esc((w.num ?? 0) + 1)}</button>
        <p>Copies this week's exercises and weights into a new week, so you only change what's different.</p></div>`;
    }
    h += `<div style="display:flex;justify-content:center;gap:8px;margin-top:8px"><button class="linkbtn" style="margin:0" data-act="weekmenu">Week settings</button><button class="linkbtn" style="margin:0;color:var(--error)" data-act="delweek">Delete this week</button></div>`;
    $("main").innerHTML = h;
  }

  function renderSession() {
    const w = cur(), s = curSession(), si = curSi;
    header(`<div class="h1" style="font-size:24px">${esc(sessionName(s, si))}</div>
      <div class="h-sub"><span>Week ${esc(w.num ?? "")} · ${weekRange(w)}</span><span id="saved" class="saved"></span></div>`);
    let h = "";
    if (editMode) {
      h += `<div class="label">Session name</div><input class="ein name" data-f="label" value="${esc(s.label)}" placeholder="e.g. Chest, Shoulder, Arms">`;
      s.exercises.forEach((e, ei) => {
        h += `<div class="ex" data-ei="${ei}"><div class="erow" style="margin:0;flex-wrap:nowrap"><input class="ein name" data-f="name" value="${esc(e.name)}" placeholder="Exercise name">
            <button class="ebtn" data-act="up" aria-label="Move up" ${ei === 0 ? "disabled" : ""}>↑</button><button class="ebtn" data-act="down" aria-label="Move down" ${ei === s.exercises.length - 1 ? "disabled" : ""}>↓</button></div>
          <div class="erow" style="align-items:center"><span style="color:var(--muted);font-size:14px;margin-right:2px">Sets</span><button class="ebtn" data-act="delset" aria-label="Remove a set" ${e.sets.length ? "" : "disabled"}>−</button><b style="min-width:18px;text-align:center">${e.sets.length}</b><button class="ebtn" data-act="addset" aria-label="Add a set">+</button>
            <button class="ebtn danger" data-act="delex" style="margin-left:auto">Remove</button></div>
          <div class="erow"><input class="ein" data-f="enote" value="${esc(e.note)}" placeholder="Note (optional)"></div></div>`;
      });
      h += `<button class="addbtn" data-act="pick">+ Add exercise</button>`;
      h += `<button class="primary" data-act="finishedit" style="margin-top:12px">Done editing</button>`;
      h += `<button class="linkbtn" data-act="delsession" style="color:var(--accent)">Delete this session</button>`;
      $("main").innerHTML = h;
      return;
    }
    if (s.missed) h += `<div class="banner"><span>Marked as missed.</span><button data-act="unmiss">Undo</button></div>`;
    h += `<div class="label">Gym</div><div class="gymbar"><div class="days gyms">${gyms.map((g) => `<button class="chip${s.gym === g ? " on" : ""}" data-act="gym" data-gym="${esc(g)}">${esc(g)}</button>`).join("")}</div><button class="gadd" data-act="addgym" aria-label="Add or remove gyms">+</button></div>`;
    h += `<div class="label">Trained on</div><div class="days compact">` +
      DAYS.map((d) => `<button class="chip${s.day === d && !s.missed ? " on" : ""}" data-act="day" data-day="${d}">${d}</button>`).join("") + `</div>`;
    h += `<p class="hint" style="margin:12px 4px 0">Tap a number to edit it, or hold and drag.</p>`;
    const named = s.exercises.filter((x) => x.name.trim()), ndone = named.filter((x) => x.done).length;
    if (named.length) h += `<div class="progress${ndone === named.length ? " full" : ""}"><div class="pt"><span>${ndone === named.length ? "Session complete" : "Progress"}</span><span>${ndone} of ${named.length} done</span></div>${waveSVG(ndone / named.length, ndone === named.length)}</div>`;
    const best = bestBefore(w, s.gym);
    h += `<div class="exlist">`;
    exDisplay(s).forEach((ei) => {
      const e = s.exercises[ei];
      h += `<div class="exr${e.done ? " done" : ""}" data-ei="${ei}">
        <div class="exr-top"><span class="grip" aria-label="Drag to reorder"><svg viewBox="0 0 12 18" fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg></span><button class="exr-name" data-act="exmenu"><span class="nm">${esc(e.name || "Untitled")}</span><span class="dots">⋯</span></button>
        <button class="tick" data-act="tick" aria-label="Mark ${esc(e.name)} done"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg></button></div>
        ${e.note ? `<div class="exnote">${esc(e.note)}</div>` : ""}
        <div class="cells">${e.sets.map((x, k) => { const pr = isPR(e, x, best); return `<div class="cell${pr ? " pr" : ""}${String(x.w || "").length >= 5 ? " wide" : ""}" style="grid-area:${Math.floor(k / 4) + 1}/${(k % 4) + 1}">${pr ? `<span class="prb">PR</span>` : ""}${half(x.w, "w", k, x.r)}${half(x.r, "r", k, x.w)}</div>`; }).join("")}<button class="addcell" data-act="addset" aria-label="Add a set" style="grid-area:${Math.max(1, Math.ceil(e.sets.length / 4))}/5">+</button></div></div>`;
    });
    if (!s.exercises.length) h += `<div class="empty">No exercises yet.</div>`;
    h += `</div>`;
    h += `<div class="btnrow"><button class="addbtn" data-act="pick">+ Add exercise</button><button class="secondary" data-act="edit">Edit</button></div>`;
    if (!s.missed) h += `<button class="linkbtn" data-act="miss">Mark this session as missed</button>`;
    $("main").innerHTML = h;
  }

  // Heaviest weight per exercise from completed sessions in earlier weeks
  function bestBefore(week, gym) {
    const m = new Map();
    for (const w of weeks) {
      if (w.start >= week.start) continue;
      for (const s of w.sessions) if (sessionDone(s) && !(gym && s.gym && s.gym !== gym)) for (const e of s.exercises) for (const x of e.sets || []) {
        const v = num(x.w); if (isNaN(v)) continue;
        const k = key(e.name); if (!m.has(k) || v > m.get(k)) m.set(k, v);
      }
    }
    return m;
  }
  function isPR(e, x, best) { const v = num(x.w), b = best.get(key(e.name)); return !isNaN(v) && b != null && v > b && !!x.r; }

  // Done exercises sit at the top, in the order they were ticked
  // The arrays keep the planned order. What you see puts done items first:
  // exercises in the order they were ticked, sessions by the weekday they were done.
  function exDisplay(s) {
    const idx = s.exercises.map((_, i) => i);
    const done = idx.filter((i) => s.exercises[i].done).sort((a, b) => (s.exercises[a].doneSeq || 0) - (s.exercises[b].doneSeq || 0) || a - b);
    return [...done, ...idx.filter((i) => !s.exercises[i].done)];
  }
  function sessDisplay(w) {
    const idx = w.sessions.map((_, i) => i);
    const done = idx.filter((i) => sessionDone(w.sessions[i])).sort((a, b) => DAYS.indexOf(w.sessions[a].day) - DAYS.indexOf(w.sessions[b].day) || a - b);
    return [...done, ...idx.filter((i) => !sessionDone(w.sessions[i]))];
  }
  // Put `item` into the planned order so it sits where it was dropped among the not-done items
  function moveInPlan(arr, item, todoOrder) {
    const rest = arr.filter((x) => x !== item), k = todoOrder.indexOf(item);
    const next = todoOrder[k + 1], prev = todoOrder[k - 1];
    const at = next ? rest.indexOf(next) : prev ? rest.indexOf(prev) + 1 : rest.length;
    rest.splice(at, 0, item);
    return rest;
  }
  function objFor(el) {
    if (el.dataset.ei != null) { const s = curSession(); return s && s.exercises[+el.dataset.ei]; }
    const w = cur(); return w && w.sessions[+el.dataset.si];
  }
  const ROWS = ".exr, .scard";
  function rowRects() {
    const m = new Map();
    $("main").querySelectorAll(ROWS).forEach((el) => { const o = objFor(el); if (o) m.set(o, el.getBoundingClientRect().top); });
    return m;
  }
  function flip(before) {
    $("main").querySelectorAll(ROWS).forEach((el) => {
      const e = objFor(el), old = before.get(e);
      if (old == null) return;
      const dy = old - el.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 320, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }
  function confetti() {
    const colors = ["#6750a4", "#d0bcff", "#7d5260", "#ffd8e4", "#1f7a43", "#c4eed0"];
    const cx = innerWidth / 2, cy = innerHeight * 0.35;
    for (let i = 0; i < 36; i++) {
      const d = document.createElement("div");
      d.className = "confetti";
      d.style.background = colors[i % colors.length];
      d.style.left = cx + "px"; d.style.top = cy + "px";
      document.body.appendChild(d);
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 220;
      const dx = Math.cos(a) * v, dy = Math.sin(a) * v - 160, rot = (Math.random() - .5) * 720;
      d.animate([{ transform: "translate(-50%,-50%) rotate(0)", opacity: 1 }, { transform: `translate(${dx}px, ${dy + 420}px) rotate(${rot}deg)`, opacity: 0 }],
        { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.15,.6,.4,1)" }).onfinish = () => d.remove();
    }
  }

  // Material 3 Expressive wavy progress indicator
  function waveSVG(frac, full) {
    const W = 300, mid = 7, wl = 24, amp = full ? 0 : 3.2, end = Math.round(Math.max(0, Math.min(1, frac)) * W);
    let d = `M0 ${mid}`, up = true;
    for (let x = 0; x < end + wl; x += wl / 2) { d += ` Q${x + wl / 4} ${up ? mid - amp * 2 : mid + amp * 2} ${x + wl / 2} ${mid}`; up = !up; }
    const ts = end > 0 ? end + 10 : 0;
    return `<svg class="wave" viewBox="0 0 ${W} 14" preserveAspectRatio="none" aria-hidden="true"><defs><clipPath id="wclip"><rect x="-4" y="-6" width="${end + 4}" height="26"/></clipPath></defs>` +
      (ts < W - 4 ? `<line class="track" x1="${ts}" y1="${mid}" x2="${W - 2}" y2="${mid}" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : "") +
      (end > 0 ? `<g clip-path="url(#wclip)"><path class="act${full ? "" : " wv"}" d="${d}" fill="none" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g>` : "") + `</svg>`;
  }

  function halfText(v, f, other) {
    const t = String(v ?? "");
    if (t) return f === "r" ? "×" + t : t;
    return f === "w" && other ? "BW" : "–"; // reps but no weight = bodyweight
  }
  function half(v, f, k, other) {
    const t = String(v ?? ""), len = t.length;
    const size = f === "w" ? (len >= 5 ? " xs" : len === 4 ? " sm" : "") : (len >= 3 ? " sm" : "");
    return `<button class="half ${f === "w" ? "hw" : "hr"}${t ? "" : " empty"}${size}" data-act="val" data-f="${f}" data-k="${k}" aria-label="Set ${k + 1} ${f === "w" ? "weight" : "reps"}">${esc(halfText(v, f, other))}</button>`;
  }
  function vbox(v, f, k) {
    const t = String(v ?? "");
    return `<td><button class="vbox${t ? "" : " empty"}${t.length > 4 ? " small" : ""}" data-act="val" data-f="${f}" data-k="${k}" aria-label="Set ${k + 1} ${f === "w" ? "weight" : "reps"}">${t ? esc(t) : "–"}</button></td>`;
  }

  function renderPast() {
    header(`<div class="h1">Past weeks</div><div class="h-sub"><span>${weeks.length} weeks logged</span><span id="saved" class="saved"></span></div>`);
    let h = "", year = null;
    for (const w of weeks.slice().reverse()) {
      const y = w.start.slice(0, 4);
      if (y !== year) { if (year) h += `</div>`; h += `<div class="yearhead">${y}</div><div class="wlist">`; year = y; }
      const d = w.sessions.filter(sessionDone).length;
      h += `<button class="wrow" data-act="openweek" data-id="${esc(w.id)}"><span class="n">Week ${esc(w.num ?? "?")}</span><span class="d">${fmtDate(w.start)}${w.tag ? " · " + esc(w.tag) : ""}</span><span class="c">${d}/${w.sessions.length} done</span></button>`;
    }
    if (year) h += `</div>`;
    if (!h) h = `<div class="empty">Nothing logged yet.</div>`;
    const lastExp = +(lsGet(EXP_KEY) || 0);
    const days = lastExp ? Math.floor((Date.now() - lastExp) / 864e5) : null;
    const lastTxt = lastExp ? (days === 0 ? "today" : days === 1 ? "yesterday" : days + " days ago") : "never";
    const stale = !lastExp || days > 30;
    h = `<div class="section" style="margin-top:16px"><h3>Backup</h3>
      <div class="backup"><div class="bl">Your data is only saved on this phone.<br><span${stale ? ' style="color:var(--accent)"' : ""}>Last backup: ${lastTxt}</span></div>
      <div class="bb"><button class="ebtn" data-act="export">Export</button><button class="ebtn" data-act="import">Import</button></div></div></div>` + h +
      `<p class="hint" style="text-align:center;margin-top:24px">Gym Tracker · version ${BUILD}</p>`;
    $("main").innerHTML = h;
  }

  // ---------- sheets ----------
  function showSheet(html, cls = "") {
    const m = $("modal");
    m.innerHTML = `<div class="scrim"><div class="sheet ${cls}" role="dialog">${html}</div></div>`;
    if (!location.hash.endsWith("-m")) location.hash = baseHash() + "-m";
    return m.firstChild;
  }
  function openModal(html, onClick) {
    const scrim = showSheet(html);
    scrim.addEventListener("click", (ev) => {
      if (ev.target === scrim) return closeModal();
      const b = ev.target.closest("[data-m]");
      if (b) onClick && onClick(b.dataset.m);
    });
  }
  let pendingAfter = null;
  let closing = false;
  function closeModal(after) {
    if (location.hash.endsWith("-m")) {
      pendingAfter = after || null;
      closing = true;
      history.back();
      // If history can't go back, close it anyway (only if this close never completed)
      setTimeout(() => { if (closing) { closing = false; location.replace("#" + baseHash()); } }, 1200);
    } else {
      $("modal").innerHTML = "";
      after && after();
    }
  }

  function showHistory(name) {
    const hist = historyFor(name);
    let h = `<h2>${esc(name)}</h2>`;
    if (!hist.length) return openModal(h + `<div class="meta">Nothing logged for this exercise yet.</div><div class="actions"><button data-m="close">Close</button></div>`, closeModal);
    const pts = hist.slice(0, 40).reverse().map((x) => Math.max(...x.sets.map((s) => num(s.w)).filter((v) => !isNaN(v)))).filter((v) => isFinite(v));
    let best = null;
    for (const x of hist) for (const s of x.sets) {
      const wv = num(s.w), rv = num(s.r);
      if (!isNaN(wv) && (!best || wv > best.w || (wv === best.w && rv > best.r))) best = { w: wv, r: rv, date: x.week.start };
    }
    h += `<div class="meta">Logged ${hist.length} times since ${fmtDate(hist[hist.length - 1].week.start, true)}</div>`;
    h += `<div class="best"><div><b>${esc(hist[0].sets.map(setText).join(", "))}</b><span>Last time · ${fmtDate(hist[0].week.start)}</span></div>`;
    if (best) h += `<div><b>${best.w}${isNaN(best.r) ? "" : " × " + best.r}</b><span>Heaviest · ${fmtDate(best.date)}</span></div>`;
    h += `</div>`;
    if (pts.length > 1) {
      const W = 320, H = 90, p = 8, mn = Math.min(...pts), mx = Math.max(...pts), rng = mx - mn || 1;
      const xy = pts.map((v, k) => [p + (k * (W - 2 * p)) / (pts.length - 1), H - p - ((v - mn) / rng) * (H - 2 * p)]);
      h += `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${xy.map((q) => q.join(",")).join(" ")}"/></svg>`;
      h += `<div class="meta" style="margin-top:0">Heaviest weight each time (last ${pts.length}): ${mn} to ${mx}</div>`;
    }
    for (const x of hist) {
      h += `<div class="hrow"><div class="hd">${fmtDate(x.week.start)} · Week ${esc(x.week.num ?? "?")}${x.session.day ? " · " + DAY_FULL[x.session.day] : ""}${x.session.gym ? " · " + esc(x.session.gym) : ""}</div>
        <div class="hs">${esc(x.sets.map(setText).join(",  "))}</div>${x.ex.note ? `<div class="hd" style="margin:3px 0 0">${esc(x.ex.note)}</div>` : ""}</div>`;
    }
    h += `<div class="actions"><button data-m="close">Close</button></div>`;
    openModal(h, closeModal);
  }

  function weekMenu() {
    const w = cur();
    openModal(`<h2>Week ${esc(w.num ?? "")} settings</h2><div class="menu">
      <button data-m="settings">Change week number, date or label</button>
      <button data-m="addsession">Add a session</button>
      <button data-m="copy">Copy week to paste into Google Sheets</button>
      <button class="danger" data-m="delweek">Delete this week</button></div>
      <div class="actions"><button data-m="close">Close</button></div>`, (a) => {
      if (a === "close") closeModal();
      if (a === "settings") weekSettings(w);
      if (a === "addsession") {
        w.sessions.push({ day: "", missed: false, label: "", note: "", exercises: [] });
        touch(w); rebuild();
        closeModal(() => { pendingEdit = true; go("session", { si: w.sessions.length - 1 }); });
      }
      if (a === "copy") copyWeek(w);
      if (a === "delweek") confirmDelete(w);
    });
  }
  function weekSettings(w) {
    openModal(`<h2>Week settings</h2>
      <div class="row2"><div><label>Week number</label><input type="number" id="f-num" value="${esc(w.num ?? "")}"></div>
      <div><label>Week starting</label><input type="date" id="f-start" value="${esc(w.start)}"></div></div>
      <label>Label (e.g. Cut, Rehab, Deload)</label><input type="text" id="f-tag" value="${esc(w.tag)}" placeholder="Optional">
      <div class="actions"><button data-m="cancel">Cancel</button><button class="go" data-m="save">Save</button></div>`, (a) => {
      if (a === "cancel") return closeModal();
      const n = parseInt($("f-num").value, 10), st = $("f-start").value;
      w.num = isNaN(n) ? null : n;
      if (/^\d{4}-\d{2}-\d{2}$/.test(st)) w.start = st;
      w.tag = $("f-tag").value.trim();
      touch(w); closeModal(); rebuild(); render();
    });
  }
  function confirmDelete(w) {
    openModal(`<h2>Delete Week ${esc(w.num ?? "")}?</h2><div class="meta">This removes the whole week and everything logged in it.</div>
      <div class="actions"><button data-m="cancel">Cancel</button><button class="danger" data-m="del">Delete</button></div>`, (a) => {
      if (a === "cancel") return closeModal();
      touch({ id: w.id, deleted: true, start: w.start });
      rebuild(); closeModal(() => go("week", { week: latest() ? latest().id : null }));
    });
  }
  async function copyWeek(w) {
    const rows = [];
    for (const s of w.sessions) {
      rows.push([s.missed ? "Missed" : (DAY_FULL[s.day] || ""), s.label].join("\t"));
      for (const e of s.exercises) rows.push([e.name, ...e.sets.map((x) => x.w + "/" + x.r), e.done ? "x" : "-"].join("\t"));
    }
    const text = rows.join("\n");
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {}
    openModal(`<h2>${ok ? "Copied" : "Copy this"}</h2><div class="meta">${ok ? "Paste it into a blank tab in your sheet." : "Select and copy the text below."}</div>
      ${ok ? "" : `<textarea style="width:100%;height:200px;background:var(--field);color:var(--ink);border:0;border-radius:8px;padding:8px">${esc(text)}</textarea>`}
      <div class="actions"><button data-m="close">Close</button></div>`, closeModal);
  }

  function confirmNewWeek() {
    const last = latest();
    if (!last) return newWeek();
    openModal(`<h2>Start Week ${esc((last.num ?? 0) + 1)}?</h2>
      <div class="meta">This makes a new week with the same sessions, exercises and weights as Week ${esc(last.num ?? "")}. You can delete it afterwards if you change your mind.</div>
      <div class="actions"><button data-m="cancel">Cancel</button><button class="go" data-m="start">Start week</button></div>`, (a) => {
      if (a === "cancel") return closeModal();
      closeModal(() => newWeek());
    });
  }

  function newWeek() {
    const last = latest();
    const thisMon = mondayOf(new Date());
    let start = thisMon;
    if (last) { const nextMon = parseDate(last.start); nextMon.setDate(nextMon.getDate() + 7); start = thisMon > nextMon ? thisMon : nextMon; }
    const w = {
      id: "w" + iso(start) + "-" + uid(),
      num: last && last.num != null ? last.num + 1 : 1,
      start: iso(start), tag: "",
      sessions: last ? clone(last.sessions).map((s) => ({ ...s, day: "", missed: false, note: "",
        exercises: s.exercises.map((e) => ({ ...e, done: false, note: "", doneSeq: undefined, byGym: s.gym ? { ...(e.byGym || {}), [s.gym]: clone(e.sets) } : e.byGym })) })) : [],
    };
    touch(w); rebuild(); go("week", { week: w.id });
  }

  // ---------- events ----------
  document.body.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || $("modal").contains(b)) return;
    if ((b.classList.contains("half") || b.classList.contains("scard")) && Date.now() - suppressClick < 350) return;
    const act = b.dataset.act;
    const w = cur(), s = curSession();
    const exel = b.closest("[data-ei]");
    const e = s && exel ? s.exercises[+exel.dataset.ei] : null;
    switch (act) {
      case "newweek": return confirmNewWeek();
      case "export": return exportBackup();
      case "import": return importInput.click();
      case "delweek": return confirmDelete(w);
      case "golatest": return go("week", { week: latest().id });
      case "open": return go("session", { si: +b.dataset.si });
      case "openweek": return go("week", { week: b.dataset.id });
      case "back": return go("week");
      case "weekmenu": return weekMenu();
      case "history": return showHistory(e.name);
      case "val": return openValSheet(+exel.dataset.ei, +b.dataset.k, b.dataset.f);
      case "exmenu": return exerciseMenu(+exel.dataset.ei);
      case "edit": editMode = true; render(); window.scrollTo(0, 0); return;
      case "finishedit": editMode = false; render(); window.scrollTo(0, 0); return;
      case "day": if (s.day === b.dataset.day) s.day = ""; else { s.day = b.dataset.day; s.missed = false; } break;
      case "miss": s.missed = true; s.day = ""; break;
      case "unmiss": s.missed = false; break;
      case "tick": {
        const before = rowRects();
        e.done = !e.done;
        if (e.done && !s.day && !s.missed) { // first tick: assume they're training today
          const t = new Date(), mon = parseDate(w.start), diff = Math.floor((t - mon) / 864e5);
          if (diff >= 0 && diff < 7) s.day = DAYS[(t.getDay() + 6) % 7];
        }
        if (e.done) e.doneSeq = Date.now(); else delete e.doneSeq;
        touch(w); render(); flip(before);
        buzz(e.done ? 15 : 6);
        if (e.done) {
          const row = $("main").querySelector(`.exr[data-ei="${s.exercises.indexOf(e)}"]`);
          row && row.classList.add("justdone");
          const named = s.exercises.filter((x) => x.name.trim());
          if (named.length && named.every((x) => x.done)) { confetti(); buzz([20, 60, 20, 60, 40]); }
        }
        return;
      }
      case "addset": { const l = e.sets[e.sets.length - 1]; e.sets.push(l ? { ...l } : { w: "", r: "" }); break; }
      case "delset": e.sets.pop(); break;
      case "pick": return openPicker();
      case "gym": { const before = rowRects(); switchGym(w, s, b.dataset.gym); render(); flip(before); buzz(8);
        $("main").querySelectorAll(".cell").forEach((c) => c.animate([{ opacity: .3, transform: "scale(.94)" }, { opacity: 1, transform: "none" }], { duration: 300, easing: "cubic-bezier(.2,.8,.2,1)" }));
        return; }
      case "addgym": return gymSheet(true);
      case "rmex": return confirmRemove(e);
      case "delex": return confirmRemove(e);
      case "up": { const i = s.exercises.indexOf(e); if (i > 0) [s.exercises[i - 1], s.exercises[i]] = [s.exercises[i], s.exercises[i - 1]]; break; }
      case "down": { const i = s.exercises.indexOf(e); if (i < s.exercises.length - 1) [s.exercises[i + 1], s.exercises[i]] = [s.exercises[i], s.exercises[i + 1]]; break; }
      case "delsession": w.sessions.splice(curSi, 1); touch(w); return go("week");
      default: return;
    }
    touch(w); render();
  });

  $("main").addEventListener("input", (ev) => {
    const el = ev.target, f = el.dataset.f;
    if (!f) return;
    const w = cur(), s = curSession();
    if (!w || !s) return;
    const exel = el.closest("[data-ei]");
    const e = exel ? s.exercises[+exel.dataset.ei] : null;
    const v = el.value;
    if (f === "name") e.name = v;
    else if (f === "enote") e.note = v;
    else if (f === "label") s.label = v;
    touch(w);
  });
  $("main").addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.matches("input")) { ev.preventDefault(); ev.target.blur(); } });

  // ---------- drag rows to reorder ----------
  // Exercises: drag the grip. Sessions: press and hold the card, then drag.
  // Done items stay in the done group; not-done items in the not-done group.
  let drag = null, hold = null;
  function beginDrag(row, y, kind) {
    const rows = [...$("main").querySelectorAll(kind === "ex" ? ".exr" : ".scard")];
    const from = rows.indexOf(row), item = objFor(row);
    let lo, hi;
    if (kind === "ex") {
      const doneCount = curSession().exercises.filter((x) => x.done).length;
      lo = item.done ? 0 : doneCount; hi = item.done ? doneCount - 1 : rows.length - 1;
    } else {
      if (sessionDone(item)) { buzz([8, 40, 8]); return false; } // done sessions stay in weekday order
      lo = cur().sessions.filter(sessionDone).length; hi = rows.length - 1;
    }
    const pos = rows.map((r) => { const bx = r.getBoundingClientRect(); return { top: bx.top + scrollY, h: bx.height }; });
    drag = { kind, row, rows, from, to: from, lo, hi, pos, item, startY: y + scrollY, y };
    row.parentElement.classList.add("sorting");
    row.classList.add("dragging");
    buzz(12);
    drag.raf = requestAnimationFrame(dragTick);
    return true;
  }
  function dragLayout() {
    const d = drag, dy = d.y + scrollY - d.startY;
    d.row.style.transform = `translateY(${dy}px) scale(1.02)`;
    const center = d.pos[d.from].top + d.pos[d.from].h / 2 + dy;
    let to = d.from;
    for (let j = 0; j < d.rows.length; j++) {
      if (j === d.from) continue;
      const mid = d.pos[j].top + d.pos[j].h / 2;
      if (j > d.from && center > mid) to = j;
      if (j < d.from && center < mid && to >= d.from) to = j;
    }
    to = Math.max(d.lo, Math.min(d.hi, to));
    if (to !== d.to) { d.to = to; buzz(4); }
    const gap = d.from + 1 < d.pos.length ? d.pos[d.from + 1].top - d.pos[d.from].top : d.pos[d.from].h + 3;
    const back = d.from > 0 ? d.pos[d.from].top - d.pos[d.from - 1].top : gap;
    d.rows.forEach((r, j) => {
      if (j === d.from) return;
      let shift = 0;
      if (d.from < to && j > d.from && j <= to) shift = -gap;
      if (to < d.from && j >= to && j < d.from) shift = back;
      r.style.transform = shift ? `translateY(${shift}px)` : "";
    });
  }
  function dragTick() {
    if (!drag) return;
    const edge = 90, y = drag.y;
    if (y < edge) scrollBy(0, -Math.ceil((edge - y) / 6));
    else if (y > innerHeight - edge - 80) scrollBy(0, Math.ceil((y - (innerHeight - edge - 80)) / 6));
    dragLayout();
    drag.raf = requestAnimationFrame(dragTick);
  }
  function dragEnd() {
    if (!drag) return;
    const d = drag; drag = null;
    cancelAnimationFrame(d.raf);
    suppressClick = Date.now();
    const before = rowRects();
    d.rows.forEach((r) => { r.style.transform = ""; });
    d.row.parentElement.classList.remove("sorting");
    d.row.classList.remove("dragging");
    const w = cur();
    if (d.to !== d.from) {
      if (d.kind === "ex") {
        const s = curSession(), list = exDisplay(s).map((i) => s.exercises[i]);
        list.splice(d.from, 1); list.splice(d.to, 0, d.item);
        if (d.item.done) list.filter((x) => x.done).forEach((x, i) => { x.doneSeq = i + 1; });
        else s.exercises = moveInPlan(s.exercises, d.item, list.filter((x) => !x.done));
      } else {
        const list = sessDisplay(w).map((i) => w.sessions[i]);
        list.splice(d.from, 1); list.splice(d.to, 0, d.item);
        w.sessions = moveInPlan(w.sessions, d.item, list.filter((x) => !sessionDone(x)));
      }
      touch(w);
    }
    if (deferredRender) { deferredRender = false; rebuild(); }
    render(); flip(before);
  }
  // exercises: grip responds immediately
  $("main").addEventListener("pointerdown", (ev) => {
    const g = ev.target.closest(".grip");
    if (!g || drag || scrub || !curSession()) return;
    ev.preventDefault();
    if (beginDrag(g.closest(".exr"), ev.clientY, "ex")) { drag.pointerId = ev.pointerId; g.setPointerCapture(ev.pointerId); }
  });
  $("main").addEventListener("pointermove", (ev) => { if (drag && drag.kind === "ex" && ev.pointerId === drag.pointerId) drag.y = ev.clientY; });
  $("main").addEventListener("pointerup", (ev) => { if (drag && drag.kind === "ex") dragEnd(); });
  $("main").addEventListener("pointercancel", (ev) => { if (drag && drag.kind === "ex") dragEnd(); });
  // sessions: press and hold, then drag
  function holdStart(card, x, y) {
    if (drag || view !== "week") return;
    hold = { card, x, y, timer: setTimeout(() => { const h = hold; hold = null; if (h) beginDrag(h.card, h.y, "ses"); }, 320) };
  }
  function holdMove(x, y, ev) {
    if (hold && (Math.abs(x - hold.x) > 8 || Math.abs(y - hold.y) > 8)) { clearTimeout(hold.timer); hold = null; }
    if (drag && drag.kind === "ses") { if (ev.cancelable) ev.preventDefault(); drag.y = y; }
  }
  function holdEnd() {
    if (hold) { clearTimeout(hold.timer); hold = null; }
    if (drag && drag.kind === "ses") dragEnd();
  }
  $("main").addEventListener("touchstart", (ev) => { const c = ev.target.closest(".scard"); if (c && ev.touches.length === 1) holdStart(c, ev.touches[0].clientX, ev.touches[0].clientY); }, { passive: true });
  document.addEventListener("touchmove", (ev) => holdMove(ev.touches[0].clientX, ev.touches[0].clientY, ev), { passive: false });
  document.addEventListener("touchend", holdEnd);
  document.addEventListener("touchcancel", holdEnd);
  $("main").addEventListener("mousedown", (ev) => { const c = ev.target.closest(".scard"); if (c && ev.button === 0) holdStart(c, ev.clientX, ev.clientY); });
  document.addEventListener("mousemove", (ev) => holdMove(ev.clientX, ev.clientY, ev));
  document.addEventListener("mouseup", holdEnd);
  $("main").addEventListener("contextmenu", (ev) => { if (ev.target.closest(".scard")) ev.preventDefault(); });

  // ---------- hold-and-drag on a number ----------
  const HOLD = 160, STEP = 14;
  let scrub = null, suppressClick = 0;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  document.body.appendChild(bubble);
  function scrubStart(el, x, y) {
    const exel = el.closest("[data-ei]");
    if (!exel || !curSession()) return;
    scrub = { el, x, y, ei: +exel.dataset.ei, k: +el.dataset.k, f: el.dataset.f, active: false };
    scrub.timer = setTimeout(scrubActivate, HOLD);
  }
  function scrubActivate() {
    if (!scrub) return;
    const e = curSession().exercises[scrub.ei], cv = e.sets[scrub.k][scrub.f] || "";
    let base = cv;
    if (!cv) { const prev = e.sets.slice(0, scrub.k).reverse().find((x) => x[scrub.f]); if (prev) base = prev[scrub.f]; }
    scrub.vals = wheelValues(scrub.f, base);
    scrub.start = scrub.idx = Math.max(0, scrub.vals.indexOf(base));
    scrub.val = cv; scrub.moved = false; scrub.active = true;
    scrub.el.classList.add("scrub");
    buzz(12);
    showBubble();
  }
  function showBubble() {
    const r = scrub.el.closest(".cell").getBoundingClientRect();
    bubble.textContent = (scrub.val === "" ? "–" : scrub.val) + (scrub.f === "w" ? " kg" : " reps");
    bubble.style.left = r.left + r.width / 2 + "px";
    bubble.style.top = r.top - 10 + "px";
    bubble.classList.add("on");
  }
  function scrubMove(x, y, ev) {
    if (!scrub) return;
    if (!scrub.active) {
      if (Math.abs(y - scrub.y) > 8 || Math.abs(x - scrub.x) > 8) { clearTimeout(scrub.timer); scrub = null; }
      return;
    }
    if (ev.cancelable) ev.preventDefault();
    const i = Math.min(scrub.vals.length - 1, Math.max(0, scrub.start + Math.round((scrub.y - y) / STEP)));
    if (i !== scrub.idx) {
      scrub.idx = i; scrub.val = scrub.vals[i]; scrub.moved = true;
      scrub.el.textContent = halfText(scrub.val, scrub.f, "x");
      buzz(3);
      showBubble();
    }
  }
  function scrubEnd() {
    if (!scrub) return;
    clearTimeout(scrub.timer);
    const sc = scrub;
    scrub = null;
    if (!sc.active) return;
    suppressClick = Date.now();
    bubble.classList.remove("on");
    sc.el.classList.remove("scrub");
    const w = cur(), set = curSession().exercises[sc.ei].sets[sc.k];
    if (sc.moved && set[sc.f] !== sc.val) { set[sc.f] = sc.val; touch(w); }
    if (deferredRender) { deferredRender = false; rebuild(); }
    render();
    if (!sc.moved) openValSheet(sc.ei, sc.k, sc.f); // held without dragging: open the wheels
  }
  $("main").addEventListener("touchstart", (ev) => {
    const el = ev.target.closest(".half");
    if (!el || ev.touches.length > 1) return;
    scrubStart(el, ev.touches[0].clientX, ev.touches[0].clientY);
  }, { passive: true });
  document.addEventListener("touchmove", (ev) => { if (scrub) scrubMove(ev.touches[0].clientX, ev.touches[0].clientY, ev); }, { passive: false });
  document.addEventListener("touchend", scrubEnd);
  document.addEventListener("touchcancel", scrubEnd);
  $("main").addEventListener("mousedown", (ev) => {
    const el = ev.target.closest(".half");
    if (!el || ev.button !== 0 || scrub) return;
    scrubStart(el, ev.clientX, ev.clientY);
  });
  document.addEventListener("mousemove", (ev) => { if (scrub) scrubMove(ev.clientX, ev.clientY, ev); });
  document.addEventListener("mouseup", scrubEnd);
  $("main").addEventListener("contextmenu", (ev) => { if (ev.target.closest(".half")) ev.preventDefault(); });

  // ---------- bottom bar follows your scroll (slides away going down, back going up) ----------
  const nav = document.querySelector("nav.tabs");
  let lastScrollY = scrollY, navOff = 0, navSnap = null;
  function navApply(animate) {
    nav.style.transition = animate ? "transform .3s var(--spring)" : "none";
    nav.style.transform = navOff ? `translateY(${navOff}px)` : "";
  }
  addEventListener("scroll", () => {
    const y = scrollY, dy = y - lastScrollY;
    lastScrollY = y;
    if (drag) return;
    const h = nav.offsetHeight;
    navOff = y <= 0 ? 0 : Math.max(0, Math.min(h, navOff + dy));
    navApply(false);
    clearTimeout(navSnap); // when scrolling stops, finish the slide one way or the other
    navSnap = setTimeout(() => { if (navOff && navOff < h) { navOff = navOff > h / 2 ? h : 0; navApply(true); } }, 120);
  }, { passive: true });

  $("tabWeek").onclick = () => go("week", { week: latest() ? latest().id : null });
  $("tabPast").onclick = () => go("past");

  // ---------- start ----------
  async function boot() {
    overrides = loadLocal();
    loadCustom();
    rebuild();
    if (location.hash.endsWith("-m")) location.replace("#" + baseHash());
    dbState = "local";
    route();
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch((e) => console.warn("offline support unavailable", e));
  }
  boot();
})();
</script>
</body>
</html>
